<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Article Sorter - Pro Version</title>
    <style>
        body { 
            margin: 0; 
            padding: 0; 
            background-color: #121212; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            touch-action: none; 
        }
        canvas { 
            background-color: #1e1e1e; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
            border-radius: 8px;
        }
    </style>
</head>
<body>

<canvas id="gameCanvas" width="400" height="600"></canvas>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // --- AUDIO SYSTEM (With iOS Unlock Hack) ---
    let audioCtx;
    let audioUnlocked = false;

    function initAudio() {
        if (!audioCtx) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
        }
        
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }

        // iOS Hack: Play a silent buffer to permanently unlock audio
        if (!audioUnlocked) {
            const buffer = audioCtx.createBuffer(1, 1, 22050);
            const source = audioCtx.createBufferSource();
            source.buffer = buffer;
            source.connect(audioCtx.destination);
            source.start(0);
            audioUnlocked = true;
        }
    }

    function playPopSound() {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'sine'; 
        osc.frequency.setValueAtTime(600, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
        
        gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.1);
    }

    function playErrorSound() {
        if (!audioCtx || audioCtx.state !== 'running') return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        
        osc.type = 'sawtooth'; 
        osc.frequency.setValueAtTime(150, audioCtx.currentTime);
        osc.frequency.linearRampToValueAtTime(50, audioCtx.currentTime + 0.3);
        
        gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
        
        osc.start();
        osc.stop(audioCtx.currentTime + 0.3);
    }
    // -------------------------------------------

    // Game State
    let score = 0;
    let gameOver = false;
    let gameStarted = false; 
    let isNewHighScore = false;
    
    let highScore = localStorage.getItem('germanVocabHighScore') || 0;
    
    // --- EXPANDED B2 VOCABULARY (50 Words) ---
    const vocab = [
        // DER (Masculine)
        { word: "Einfluss", article: "Der" }, { word: "Erfolg", article: "Der" },
        { word: "Gedanke", article: "Der" }, { word: "Prozess", article: "Der" },
        { word: "Staat", article: "Der" }, { word: "Verlust", article: "Der" },
        { word: "Zweifel", article: "Der" }, { word: "Anspruch", article: "Der" },
        { word: "Begriff", article: "Der" }, { word: "Betrieb", article: "Der" },
        { word: "Eindruck", article: "Der" }, { word: "Fehler", article: "Der" },
        { word: "Schutz", article: "Der" }, { word: "Verlag", article: "Der" },
        { word: "Vertrag", article: "Der" }, { word: "Wert", article: "Der" },
        { word: "Zweck", article: "Der" }, { word: "Zusammenhang", article: "Der" },
        
        // DIE (Feminine)
        { word: "Erfahrung", article: "Die" }, { word: "Forderung", article: "Die" },
        { word: "Grundlage", article: "Die" }, { word: "Herausforderung", article: "Die" },
        { word: "Leistung", article: "Die" }, { word: "Maßnahme", article: "Die" },
        { word: "Regel", article: "Die" }, { word: "Regierung", article: "Die" },
        { word: "Sicherheit", article: "Die" }, { word: "Unterstützung", article: "Die" },
        { word: "Ursache", article: "Die" }, { word: "Verfügung", article: "Die" },
        { word: "Wirtschaft", article: "Die" }, { word: "Bedeutung", article: "Die" },
        { word: "Eigenschaft", article: "Die" }, { word: "Entscheidung", article: "Die" },
        { word: "Forschung", article: "Die" }, { word: "Gesellschaft", article: "Die" },
        
        // DAS (Neuter)
        { word: "Angebot", article: "Das" }, { word: "Bewusstsein", article: "Das" },
        { word: "Datum", article: "Das" }, { word: "Detail", article: "Das" },
        { word: "Ereignis", article: "Das" }, { word: "Gesetz", article: "Das" },
        { word: "Konzept", article: "Das" }, { word: "Modell", article: "Das" },
        { word: "Risiko", article: "Das" }, { word: "System", article: "Das" },
        { word: "Unternehmen", article: "Das" }, { word: "Verhalten", article: "Das" },
        { word: "Wachstum", article: "Das" }, { word: "Ziel", article: "Das" },
        { word: "Mitglied", article: "Das" }, { word: "Recht", article: "Das" },
        { word: "Ergebnis", article: "Das" }
    ];

    let currentWord = null;
    let particles = []; 

    function spawnWord() {
        const randomVocab = vocab[Math.floor(Math.random() * vocab.length)];
        currentWord = {
            text: randomVocab.word,
            article: randomVocab.article,
            x: canvas.width / 2,
            y: -30,
            speed: 2 + (score * 0.2) 
        };
    }

    function resetGame() {
        score = 0;
        gameOver = false;
        isNewHighScore = false;
        particles = [];
        spawnWord();
    }

    function createParticles(x, y) {
        for (let i = 0; i < 15; i++) {
            particles.push({
                x: x,
                y: y,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 1.0, 
                decay: Math.random() * 0.05 + 0.02, 
                size: Math.random() * 4 + 2
            });
        }
    }

    function drawAndVerifyParticles() {
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= p.decay;

            if (p.life > 0) {
                ctx.fillStyle = `rgba(76, 175, 80, ${p.life})`; 
                ctx.fillRect(p.x, p.y, p.size, p.size);
            } else {
                particles.splice(i, 1);
            }
        }
    }

    function triggerGameOver() {
        if (!gameOver) {
            playErrorSound(); 
            gameOver = true;
            if (score > highScore) {
                highScore = score;
                isNewHighScore = true;
                localStorage.setItem('germanVocabHighScore', highScore);
            }
        }
    }

    function handleInput(direction) {
        if (!gameStarted || gameOver || !currentWord) return;

        let guessedArticle = "";
        if (direction === "LEFT") guessedArticle = "Der";
        if (direction === "DOWN") guessedArticle = "Die";
        if (direction === "RIGHT") guessedArticle = "Das";

        if (guessedArticle === currentWord.article) {
            playPopSound(); 
            createParticles(currentWord.x, currentWord.y - 10);
            score++;
            spawnWord();
        } else {
            triggerGameOver();
        }
    }

    // Keyboard Controls
    window.addEventListener('keydown', (e) => {
        initAudio(); // Force unlock audio on first interaction

        if (!gameStarted) {
            gameStarted = true;
            return;
        }

        if (gameOver) {
            resetGame();
            return;
        }

        if (e.key === 'ArrowLeft') handleInput("LEFT");
        if (e.key === 'ArrowDown') handleInput("DOWN");
        if (e.key === 'ArrowRight') handleInput("RIGHT");
    });

    // Touch/Swipe Controls
    let touchStartX = 0;
    let touchStartY = 0;

    canvas.addEventListener('touchstart', (e) => {
        initAudio(); // Force unlock audio on first tap

        if (!gameStarted) {
            gameStarted = true;
            return;
        }

        if (gameOver) {
            resetGame();
            return;
        }

        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
    });

    canvas.addEventListener('touchend', (e) => {
        if (!gameStarted || gameOver) return;

        let touchEndX = e.changedTouches[0].screenX;
        let touchEndY = e.changedTouches[0].screenY;
        
        let dx = touchEndX - touchStartX;
        let dy = touchEndY - touchStartY;

        if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 30) {
            if (dx < 0) handleInput("LEFT");
            else handleInput("RIGHT");
        } else if (Math.abs(dy) > 30 && dy > 0) {
            handleInput("DOWN");
        }
    });

    // Main Game Loop
    function update() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // Start Screen
        if (!gameStarted) {
            ctx.fillStyle = "#4CAF50";
            ctx.font = "bold 32px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText("Article Sorter", canvas.width / 2, canvas.height / 2 - 120);

            ctx.fillStyle = "white";
            ctx.font = "bold 20px sans-serif";
            ctx.fillText("How to Play:", canvas.width / 2, canvas.height / 2 - 60);

            ctx.font = "16px sans-serif";
            ctx.fillStyle = "#ccc";
            ctx.fillText("Desktop: Arrow Keys (\u2190 \u2193 \u2192)", canvas.width / 2, canvas.height / 2 - 20);
            ctx.fillText("Mobile: Swipe (Left, Down, Right)", canvas.width / 2, canvas.height / 2 + 10);

            ctx.fillStyle = "#FFD700";
            ctx.fillText("Sort the nouns into the correct buckets:", canvas.width / 2, canvas.height / 2 + 60);
            
            ctx.fillStyle = "#666";
            ctx.fillText("Left = Der | Down = Die | Right = Das", canvas.width / 2, canvas.height / 2 + 90);

            ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now() / 300); 
            ctx.fillStyle = "white";
            ctx.font = "bold 22px sans-serif";
            ctx.fillText("Tap or Press Any Key to Start", canvas.width / 2, canvas.height / 2 + 160);
            ctx.globalAlpha = 1.0; 

            requestAnimationFrame(update);
            return; 
        }

        // Game Over Screen
        if (gameOver) {
            ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "white";
            ctx.textAlign = "center";
            
            if (isNewHighScore) {
                ctx.fillStyle = "#FFD700"; 
                ctx.font = "bold 28px sans-serif";
                ctx.fillText("NEW HIGH SCORE!", canvas.width / 2, canvas.height / 2 - 60);
                ctx.fillStyle = "white";
            } else {
                ctx.font = "bold 24px sans-serif";
                ctx.fillText("Game Over!", canvas.width / 2, canvas.height / 2 - 50);
            }

            ctx.font = "18px sans-serif";
            ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 - 10);
            
            ctx.globalAlpha = 0.5 + 0.5 * Math.sin(Date.now() / 300); 
            ctx.fillStyle = "#4CAF50";
            ctx.font = "bold 22px sans-serif";
            ctx.fillText("Tap to Play Again", canvas.width / 2, canvas.height / 2 + 50);
            ctx.globalAlpha = 1.0;
            
            requestAnimationFrame(update);
            return;
        }

        // Draw UI Buckets
        ctx.fillStyle = "#666";
        ctx.font = "14px sans-serif";
        ctx.textAlign = "left";
        ctx.fillText("<- DER", 20, canvas.height - 30);
        ctx.textAlign = "center";
        ctx.fillText("v DIE v", canvas.width / 2, canvas.height - 30);
        ctx.textAlign = "right";
        ctx.fillText("DAS ->", canvas.width - 20, canvas.height - 30);

        // Draw Current Score
        ctx.fillStyle = "#fff";
        ctx.textAlign = "left";
        ctx.font = "18px sans-serif";
        ctx.fillText("Score: " + score, 20, 40);

        // Draw High Score
        ctx.fillStyle = "#FFD700"; 
        ctx.textAlign = "right";
        ctx.fillText("Best: " + highScore, canvas.width - 20, 40);

        // Draw Particles
        drawAndVerifyParticles();

        // Update and Draw Word
        if (currentWord) {
            currentWord.y += currentWord.speed;
            
            ctx.fillStyle = "#4CAF50";
            ctx.font = "bold 28px sans-serif";
            ctx.textAlign = "center";
            ctx.fillText(currentWord.text, currentWord.x, currentWord.y);

            if (currentWord.y > canvas.height - 60) {
                triggerGameOver();
            }
        }

        requestAnimationFrame(update);
    }

    // Start Game
    spawnWord();
    update();

</script>
</body>
</html>
